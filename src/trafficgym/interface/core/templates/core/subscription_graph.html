{% extends "core/base.html" %}
{% block title %}Subscription Table{% endblock %}

{% block content %}

<h2>{{ fingerprint }}</h2>

<canvas id="chart"></canvas>

<script>
const labels = {{ timestamps|safe }};
const data = {{ values|safe }};

    {% if worker_logs %}
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <td>Time</td>
                <td>Level</td>
                <td>Message</td>
            </tr>
        </thead>
        <tbody>
            {% for log in worker_logs %}
            <tr>
                <td>{{ log.event_time }}</td>
                <td>{{ log.level }}</td>
                <td>{{ log.message }}</td>
            {% endfor %}
        </tbody>
    </table>

    <nav aria-label="Worker logs pagination" class="mt-3">
        <ul class="pagination justify-content-center">
            {% if worker_logs.has_previous %}
                <li class="page-item">
                    <a class="page-link" href="?page={{ worker_logs.previous_page_number }}{% if level_filter %}&level={{ level_filter }}{% endif %}">Previous</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">Previous</span></li>
            {% endif %}

            {% for num in worker_logs.paginator.page_range %}
                {% if num == worker_logs.number %}
                    <li class="page-item active"><span class="page-link">{{ num }}</span></li>
                {% elif num >= worker_logs.number|add:"-2" and num <= worker_logs.number|add:"2" %}
                    <li class="page-item">
                        <a class="page-link" href="?page={{ num }}{% if level_filter %}&level={{ level_filter }}{% endif %}">{{ num }}</a>
                    </li>
                {% endif %}                        
            {% endfor %}

            {% if worker_logs.has_next %}
            <li class="page-item">
                <a class="page-link" href="?page={{ worker_logs.next_page_number }}{% if level_filter %}&level={{ level_filter }}{% endif %}">Next</a>
            </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">Next</span></li>
            {% endif %}
        </ul>
    </nav>
    {% else %}
        <p>No log entries to show</p>
    {% endif %}
{% endblock %}
