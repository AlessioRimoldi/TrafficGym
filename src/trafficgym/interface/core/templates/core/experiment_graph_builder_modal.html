<div class="modal-header">
    <h5 class="modal-title">Create Experiment from Scenario</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <div class="mb-3">
        <label class="form-label fw-bold">Scenario</label>
        <select class="form-select" id="gbScenarioSelect">
            <option value="">-- select a scenario --</option>
            {% for s in scenarios %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    {% if initial_graph %}{{ initial_graph|json_script:"gbInitialGraph" }}{% endif %}
    <div id="gbBuilder"></div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
</div>
