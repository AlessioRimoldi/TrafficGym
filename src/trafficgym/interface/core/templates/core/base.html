{% load static %}

<!doctype html>
<html lang="en-GB">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <style>
            .caret-icon {
                display: inline-block;
                transition: transform 0.2s ease;
            }

            .card-header:not(.collapsed) > .caret-icon {
                transform: rotate(90deg);
            }

            .loading {
                cursor: wait;
            }

            .logs-table {
                table-layout: fixed;
                width: 100%;
            }
            
            .logs-table th:nth-child(1),
            .logs-table td:nth-child(1) {
                width: 180px;
            }
            
            .logs-table th:nth-child(2),
            .logs-table td:nth-child(2) {
                width: 100px;
            }
            
            .logs-table th:nth-child(3),
            .logs-table td:nth-child(3) {
                width: auto;
            }

            .logs-table td {
                vertical-align: top;
                overflow-wrap: anywhere;
            }

            .progress-smooth {
                transition: width 0.8s ease;
            }

            .traceback-block {
                max-height: 400px;
                overflow: auto;

                white-space: pre-wrap;
                word-break: break-word;

                margin: 0;
            }
            html, body {
                height: 100%;
            }

            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .page-content {
                flex: 1;
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="{% static "core/js/build/base.js" %}" defer></script>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Default Title{% endblock %}</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a href="/" class="navbar-brand ms-2"><img style="width: 100px; padding-top: 15px;" role="img" src="{% static 'core/unjam_white.svg' %}" alt="Unjam Logo"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a href="{% url "run_requests_list" %}" class="nav-link">Run Requests</a>
                        </li>
                        <li class="nav-item">
                            <a href="{% url "analytics_overview" %}" class="nav-link">Analytics (Recent Run)</a>
                        </li>
                        <li class="nav-item">
                            <a href="{% url "scenario_overview" %}" class="nav-link">Scenarios</a>
                        </li>
                        <li class="nav-item">
                            <a href="{% url "experiment_overview" %}" class="nav-link">Experiments</a>
                        </li>
                        <li class="nav-item">
                            <a href="{% url "artefacts_list" %}" class="nav-link">Artefacts</a>
                        </li>
                    </ul>
                    {% comment %} <button id="openCreateRunModal" class="btn btn-success ms-auto" data-bs-toggle="modal" data-bs-target="#createRunModal">Create new Run Request</button> {% endcomment %}
                    <button id="openCreateRunModal" class="btn btn-success ms-auto me-4" data-url="{% url 'create_run_modal' %}">Create new Run Request</button>
                </div>
            </div>
        </nav>

        <div class="modal fade" id="previewModal" tabindex="-1">
            <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                <h5 class="modal-title" id="previewTitle">Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="previewContent" class="p-3 bg-light border rounded"
                        style="white-space: pre-wrap; max-height: 70vh; overflow: auto;">
                    </pre>
                </div>
                <div id="previewFooter" class="modal-footer" style="display:none;">
                    <a id="previewArtefactLink" href="#" class="btn btn-sm btn-outline-secondary">Details</a>
                    <a id="previewNewTabLink" href="#" target="_blank" class="btn btn-sm btn-outline-primary">Open&nbsp;<i class="bi bi-box-arrow-up-right"></i></a>
                </div>
            </div>
            </div>
        </div>

        <div class="modal fade" id="createRunModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content" id="createRunModalContent">
                    <!-- Modal content will be inserted here on click -->
                </div>
            </div>
        </div>

        <div class="container my-4 page-content">
            {% block content %}
            {% endblock %}
        </div>

        <footer class="bg-dark border-top border-secondary">
            <div class="container d-flex flex-wrap justify-content-between align-items-center py-3">
                <div class="col-md d-flex align-items-center">
                    {% comment %} <a href="/" class="mb-3 mb-md-0 text-body-secondary text-decoration-none lh-1"><img style="width: 100px;" role="img" src="{% static 'core/unjam_white.svg' %}" alt="Unjam Logo"></a> {% endcomment %}
                    <span class="mb-3 mb-md-0 text-light">
                        Unjam
                    </span>
                </div>
            </div>
        </footer>

    </body>
</html>
