{% load static %}
<div class="position-relative overflow-hidden" style="flex: 1; display: flex; flex-direction: column;">
    <img src="{% static background_image %}" alt="background"
         style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.35);"></div>
    <div class="position-relative d-flex align-items-center justify-content-center" style="flex: 1;">
        <div class="text-center p-5 rounded-4"
             style="background: rgba(255,255,255,0.15);
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                    border: 1px solid rgba(255,255,255,0.3);
                    animation: fadeIn 0.6s ease-in;
                    max-width: 600px;">
            <h2 class="text-white mb-3">{{ title }}</h2>
            <p class="text-white mb-2">{{ description }}</p>
            <p class="mb-4" style="color: rgba(255,255,255,0.7); font-size: 0.9em;">{{ subtitle }}</p>
            <div class="d-flex justify-content-center gap-3">
                <button type="button" class="btn btn-primary btn-lg"
                        data-bs-toggle="modal" data-bs-target="#{{ modal_id }}">
                    {{ cta_label }}
                </button>
                <a href="{{ docs_url }}" target="_blank"
                   class="btn btn-lg" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5);">
                    Documentation
                </a>
            </div>
            <p class="mt-4 mb-0" style="font-size: 0.7em; color: rgba(255,255,255,0.5);">
                Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank"
                              style="color: rgba(255,255,255,0.5);">OpenStreetMap</a> contributors
            </p>
        </div>
    </div>
</div>
<style>
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
